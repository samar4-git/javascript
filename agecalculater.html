<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container ">
        <div class="row justify-content-center">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <div class="card-title">
                            Age Calculator
                        </div>
                        <label for="age"></label>
                        <input type="date" class="form-control" id="age" name="age">
                        <button class="btn btn-primary mt-3" type="submit" onclick="calculateAge()">Sumbit</button>
                    </div>
                    <div id="result">

                    </div>
                </div>
            </div>

        </div>

    </div>
</body>
<script>
    function calculateAge() {
         let age = document.getElementById("age").value
          age = new Date(age + "T00:00:00")
         const today = new Date();
         const year = today.getFullYear() -  age.getFullYear();
         const month = today.getMonth() -  age.getMonth();
         const date = today.getDate() -  age.getDate();
         


        document.getElementById("result").innerHTML = "year = "+year + `</br>` 
        document.getElementById("result").innerHTML += "month = "+month + `</br>`
        document.getElementById("result").innerHTML += "date = "+date 


         
    }
   
    
    

</script>
</html>
