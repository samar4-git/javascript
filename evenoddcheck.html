<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-4">
                <div class="card">
                   <div class="card-body">
                       <div class="card-title text-primary">Even Odd Checker</div>
          
                       <input type="number" placeholder="Enter A Number" id="prompt">
                       <button onclick="evenOrOdd()" class="btn btn-primary">Enter</button>
                   </div>
                   <div id="result">

                   </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
 function  evenOrOdd(){
    let user = document.getElementById("prompt").value
    if(user % 2 == 0){
       document.getElementById("result").innerHTML = "even";
    }

    else{
        document.getElementById("result").innerHTML = "odd";
    }
 }
</script>
</html>
