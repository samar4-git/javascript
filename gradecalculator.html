<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container justify-content-center">
        <div class="card">
            <div class="card-body">
                <h1>Grade Calculator</h1>

                <label for="marks" class="form-label">Your Marks</label>
                <input type="number" class="form-control" name="marks" id="marks" placeholder="Enter Marks Obtained">
                <label for="Total" class="form-label mt-4">Total Marks</label>
                <input type="number" class="form-control" name="Total" id="Total" placeholder="Enter The Total Marks">

                <button class="btn btn-success mt-4" onclick="grade()">Percentage And Grade</button>

                <div class="resultt text-success pt-3 fw-bold">

                </div>

                <div id="fail" class="text-danger pt-3 fw-bold">

                </div>



            </div>
        </div>
    </div>
</body>
<script>
    function grade() {
        const marks = document.getElementById("marks").value
        const total = document.getElementById("Total").value

        let percentage = marks / total * 100;
        let grade = ""
        const variable = Number(percentage)

        if (variable > 90) {
            grade = "grade: A"
        }
        else if (variable > 80) {
            grade = "grade: B"
        }

        else if (variable > 70) {
            grade = "grade: C"
        }

        else if (variable > 60) {
            grade = "grade: D"
        }

        else {
            grade = "grade: F (fail)"
        }

        if (grade == "grade: F (fail)") {
          document.getElementById("fail").innerHTML = grade
        }

        else {
            document.getElementsByClassName("resultt")[0].innerHTML = grade
        }



    }
</script>

</html>
