<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <div class="card-title mt-3">
                           Find The Largest Of Three Numbers
                        </div>
                        <input class="form-control mt-3" type="number" id="FirstNumber" placeholder="Enter First Number">
                        <input class="form-control mt-3" type="number" id="SecondNumber" placeholder="Enter Second Number">
                        <input class="form-control mt-3" type="number" id="ThirdNumber" placeholder="Enter Third Number">

                        <button class="btn btn-primary mt-3" onclick="main()">Print Largest</button>

                        <div id="result" class="mt-3 text text-primary  text-center">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script>
    function main() {
        let a = document.getElementById("FirstNumber").value;
        let b = document.getElementById("SecondNumber").value;
        let c = document.getElementById("ThirdNumber").value;
        let largest = Math.max(a, b, c);

        if(a === "" || b === "" || c === ""){
            document.getElementById("result").innerHTML ="Please enter all three numbers."; 
            return;
        }

        document.getElementById("result").innerHTML = largest
    }
</script>

</html>
