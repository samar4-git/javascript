
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .calculator {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0002;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #4338ca;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      line-height: 1.8;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h1>Grade Calculator</h1>

    <label for="marks">Marks Obtained</label>
    <input type="number" id="marks"
           placeholder="Enter marks obtained"
           min="0" step="any">

    <label for="total">Total Marks</label>
    <input type="number" id="total"
           placeholder="Enter total marks"
           min="0" step="any">

    <button onclick="calculateGrade()">
      Calculate Grade
    </button>

    <div id="result" aria-live="polite"></div>
  </div>

  <script>
    function calculateGrade() {
      const marks = Number(
        document.getElementById("marks").value
      );

      const total = Number(
        document.getElementById("total").value
      );

      const result = document.getElementById("result");

      if (
        document.getElementById("marks").value === "" ||
        document.getElementById("total").value === "" ||
        !Number.isFinite(marks) ||
        !Number.isFinite(total) ||
        total <= 0 ||
        marks < 0 ||
        marks > total
      ) {
        result.style.color = "red";
        result.textContent =
          "Please enter valid marks and total.";
        return;
      }

      const percentage = (marks / total) * 100;
      let grade;

      if (percentage >= 90) {
        grade = "A+";
      } else if (percentage >= 80) {
        grade = "A";
      } else if (percentage >= 70) {
        grade = "B";
      } else if (percentage >= 60) {
        grade = "C";
      } else if (percentage >= 40) {
        grade = "D";
      } else {
        grade = "F (Fail)";
      }

      result.style.color =
        percentage >= 40 ? "#16a34a" : "#dc2626";

      result.innerHTML =
        "Percentage: " + percentage.toFixed(2) + "%<br>" +
        "Grade: " + grade;
    }
  </script>
</body>
</html>
