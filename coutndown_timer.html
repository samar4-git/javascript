<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Age Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450px;">

        <h2 class="text-primary text-center mb-4">
            Age Calculator
        </h2>

        <label class="form-label">Enter Date of Birth</label>
        <input type="date" id="dob" class="form-control mb-3">

        <button class="btn btn-success w-100" onclick="calculateAge()">
            Calculate Age
        </button>

        <h5 id="result" class="text-danger text-center mt-4"></h5>

    </div>
</div>

<script>
function calculateAge() {
    let dobValue = document.getElementById("dob").value;
    let result = document.getElementById("result");

    if (dobValue === "") {
        result.textContent = "Please select your date of birth.";
        return;
    }

    let dob = new Date(dobValue + "T00:00:00");
    let today = new Date();

    if (dob > today) {
        result.textContent = "Date of birth cannot be in the future.";
        return;
    }

    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();

    if (days < 0) {
        months--;
        let previousMonthDays = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();
        days += previousMonthDays;
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    result.textContent =
        "Your Age: " + years + " Years, " +
        months + " Months, " + days + " Days";
}
</script>

</body>
</html>
