<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container text-center">
        <h1>Countdown Timer</h1>

        <div class="">
            <p id="demo" class="fw-bold fs-5">  
                <input type="number" id="minutes"
           min="0" placeholder="Minutes" value="1">
        </p>
            <button class="btn btn-success" onclick="startInterval()">Start</button>
            <button class="btn btn-warning" onclick="pauseInterval()">Pause</button>
            <button class="btn btn-danger" onclick="resetInterval()">Reset</button>
        </div>
    </div>
</body>
<script>
    let time = document.getElementById("minutes").value;

   
   
    let element = document.getElementById("demo")
    let interval = null;
   


    function pauseInterval(){
        clearInterval(interval);
        interval = null
    }

    function resetInterval(){
        time = localStorage.getItem('cookies');
        element.innerHTML = time
    }

    function startInterval(){

          time = document.getElementById("minutes").value
   let cookies = localStorage.setItem('cookies',time);
    console.log(localStorage.getItem('cookies'))
   
         interval = setInterval(function () {
        if (time >= 0) {
            element.innerHTML = time--;
        }
        
        else{
            alert('time up');
            clearInterval(interval);
        }
    }, 1000);
    }

    //document.body.style.backgroundColor = 'your-color'
</script>

</html>
