<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="table()">Print Table</button>
    <input type="number" id="generator-id">

    <div id="print-table">

    </div>
</body>
<script>
    function table() {
        document.getElementById("print-table").innerHTML=""
        const number = document.getElementById("generator-id").value
        for (let i=1; i<=10; i++) {
            const print=number * i
            document.getElementById("print-table").innerHTML+=print+'<br/>'
        }
    }
</script>
</html>
