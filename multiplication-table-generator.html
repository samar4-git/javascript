<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="generator-id" onclick="table()">Print Table</button>
</body>
<script>
    function table() {
        const number = document.getElementById("generator-id").value
        for (let i = 1; i <= 10; i++){
            console.log(number * i)
        }
    }
</script>
</html>
