<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container justify-content-center">

        <h2>colour changer</h2>

        <button class="btn btn-primary" onclick="colorBlue()">Blue</button>
        <button class="btn btn-warning" onclick="colorYellow()">Yellow</button>
        <button class="btn btn-success" onclick="colorGreen()">Green</button>
        <button class="btn btn-danger" onclick="colorRed()">Red</button>

    </div>
</body>
<script>
    function colorRed(colour) {
        document.body.style.backgroundColor = "red";
    }

    function colorBlue(colour) {
        document.body.style.backgroundColor = "blue";
    }

    function colorGreen(colour) {
        document.body.style.backgroundColor = "green";
    }

    function colorYellow(colour) {
        document.body.style.backgroundColor = "yellow";
    }
</script>

</html>
