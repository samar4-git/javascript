<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container justify-content-center">

        <h2>colour changer</h2>

        <button class="btn btn-primary" onclick="colorRed('blue')">Blue</button>
        <button class="btn btn-warning" onclick="colorRed('yellow')">Yellow</button>
        <button class="btn btn-success" onclick="colorRed('green')">Green</button>
        <button class="btn btn-danger" onclick="colorRed('red')">Red</button>

    </div>
</body>
<script>
    function colorRed(colour) {
        document.body.style.backgroundColor = colour;
    }

    
</script>

</html>
